<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DBNerd Beta</title>
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var urlTheme = params.get('theme');
          var appTheme = urlTheme;
          if (!appTheme) {
            var raw = localStorage.getItem('db_nerd_user_settings');
            if (raw) {
              var parsed = JSON.parse(raw);
              appTheme = parsed.appTheme || (parsed.themeMode === 'light' ? 'default-light' : 'default-dark');
            }
          }
          if (appTheme === 'light' || appTheme === 'default-light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'default-light');
          } else if (appTheme === 'dark' || appTheme === 'default-dark') {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'default-dark');
          } else if (appTheme && appTheme !== 'auto') {
            // Custom developer themes (Monokai, Dracula, One Dark, etc.)
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', appTheme);
          } else {
            // Auto
            var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (isDark) {
              document.documentElement.classList.remove('light');
              document.documentElement.classList.add('dark');
              document.documentElement.setAttribute('data-theme', 'default-dark');
            } else {
              document.documentElement.classList.remove('dark');
              document.documentElement.classList.add('light');
              document.documentElement.setAttribute('data-theme', 'default-light');
            }
          }
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0a0f1d;
        color: #f1f5f9;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      html.light, html.light body {
        background-color: #f8fafc;
        color: #0f172a;
        color-scheme: light;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      @keyframes app-spin {
        to { transform: rotate(360deg); }
      }
      .app-initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        background-color: inherit;
        color: #64748b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .app-initial-spinner {
        width: 24px;
        height: 24px;
        border: 2px solid rgba(148, 163, 184, 0.2);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: app-spin 0.7s linear infinite;
        margin-bottom: 12px;
      }
    </style>
    <script>
      window.addEventListener('error', function(e) {
        var errDiv = document.getElementById('runtime-error-display');
        if (errDiv) {
          errDiv.style.display = 'block';
          errDiv.innerText += '\n' + (e.message || 'Unknown runtime error');
        }
      });
    </script>
  </head>

  <body class="bg-[#0a0f1d] text-slate-100 min-h-screen">
    <div id="root">
      <div class="app-initial-loader">
        <div class="app-initial-spinner"></div>
      </div>
    </div>
    <div id="runtime-error-display" style="display:none;position:fixed;bottom:0;left:0;right:0;max-height:40%;overflow:auto;background:rgba(220,38,38,0.95);color:#fff;padding:12px;font-family:monospace;font-size:12px;z-index:99999;white-space:pre-wrap;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
