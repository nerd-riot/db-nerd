[package]
name = "dbnerd"
version = "0.1.0"
description = "A fast, lightweight, native-feel database client for developers"
authors = ["Khoa Nguyen"]
license = "MIT"
edition = "2021"

[[bin]]
name = "DBNerd"
path = "src/main.rs"

[lib]
name = "db_nerd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# Database Drivers
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "mysql",
    "sqlite",
    "chrono",
    "uuid",
    "rust_decimal"
] }

chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1.36"

redis = { version = "0.27", default-features = false, features = ["tokio-comp", "aio"] }

async-trait = "0.1"
futures-util = "0.3"
thiserror = "2.0"
anyhow = "1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
