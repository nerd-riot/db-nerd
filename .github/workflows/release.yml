name: Release & Multiplatform Build

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Release type to bump (Trunk-Based SemVer: 1.0.xx)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_tag:
        description: 'Custom tag (e.g. v1.0.0) - only used if bump_type is "custom"'
        required: false
        type: string
      dry_run:
        description: 'Dry run (build artifacts without publishing final release)'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  prepare-release:
    name: 🏷️ Calculate SemVer Tag & Draft Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip release]') && !contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      tag: ${{ steps.semver.outputs.next_tag }}
      skip_release: ${{ steps.semver.outputs.skip_release }}
      release_name: ${{ steps.release_notes.outputs.name }}
      release_body: ${{ steps.release_notes.outputs.body }}
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔍 Determine Previous and Next SemVer Tag
        id: semver
        shell: bash
        run: |
          set -e

          # If triggered by a pushed tag directly
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
            echo "Triggered by tag push: ${TAG_NAME}"
            echo "next_tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
            echo "skip_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fetch all tags from remote
          git fetch --tags --force

          # Find latest semver tag
          LATEST_TAG=$(git tag -l "v*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          echo "Previous release tag: ${LATEST_TAG:-none}"
          echo "previous_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"

          if [ -z "$LATEST_TAG" ]; then
            NEXT_TAG="v1.0.0"
            echo "No previous tags found. Initializing baseline at ${NEXT_TAG}."
          else
            VERSION="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

            EVENT_NAME="${{ github.event_name }}"
            MANUAL_BUMP="${{ github.event.inputs.bump_type }}"
            CUSTOM_TAG="${{ github.event.inputs.custom_tag }}"

            if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$MANUAL_BUMP" ]; then
              if [ "$MANUAL_BUMP" = "major" ]; then
                NEXT_TAG="v$((MAJOR + 1)).0.0"
              elif [ "$MANUAL_BUMP" = "minor" ]; then
                NEXT_TAG="v${MAJOR}.$((MINOR + 1)).0"
              elif [ "$MANUAL_BUMP" = "custom" ] && [ -n "$CUSTOM_TAG" ]; then
                [[ "$CUSTOM_TAG" =~ ^v ]] && NEXT_TAG="$CUSTOM_TAG" || NEXT_TAG="v$CUSTOM_TAG"
              else
                NEXT_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
              fi
            else
              COMMITS_SINCE_TAG=$(git log "${LATEST_TAG}..HEAD" --oneline || true)

              if [ -z "$COMMITS_SINCE_TAG" ]; then
                echo "No new commits since ${LATEST_TAG}. Skipping automated release."
                echo "skip_release=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              if echo "$COMMITS_SINCE_TAG" | grep -qE 'BREAKING CHANGE|!:'; then
                NEXT_TAG="v$((MAJOR + 1)).0.0"
              elif echo "$COMMITS_SINCE_TAG" | grep -qE '^[a-f0-9]+ feat(\(.*\))?:'; then
                NEXT_TAG="v${MAJOR}.$((MINOR + 1)).0"
              else
                NEXT_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
              fi
            fi
          fi

          echo "Calculated next release tag: ${NEXT_TAG}"
          echo "next_tag=${NEXT_TAG}" >> "$GITHUB_OUTPUT"
          echo "skip_release=false" >> "$GITHUB_OUTPUT"

      - name: 📝 Generate Release Notes via GitHub API
        if: steps.semver.outputs.skip_release != 'true'
        id: release_notes
        uses: actions/github-script@v7
        with:
          script: |
            const nextTag = '${{ steps.semver.outputs.next_tag }}';
            const prevTag = '${{ steps.semver.outputs.previous_tag }}' || undefined;
            
            console.log(`Generating release notes for ${nextTag} (previous: ${prevTag || 'none'})...`);
            
            try {
              const res = await github.rest.repos.generateReleaseNotes({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: nextTag,
                previous_tag_name: prevTag,
                target_commitish: 'main'
              });
              
              core.setOutput('name', res.data.name || `Release ${nextTag}`);
              core.setOutput('body', res.data.body || `Automated Release ${nextTag}`);
            } catch (err) {
              console.warn('Failed to call generateReleaseNotes, using fallback template:', err.message);
              core.setOutput('name', `Release ${nextTag}`);
              core.setOutput('body', `### 🚀 Release ${nextTag}\n\nAutomated release generated from \`main\` branch.\n\n* Full Commits: https://github.com/${context.repo.owner}/${context.repo.repo}/commits/${nextTag}`);
            }

      - name: 📦 Create Draft GitHub Release
        if: steps.semver.outputs.skip_release != 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ steps.semver.outputs.next_tag }}"
          TITLE="${{ steps.release_notes.outputs.name }}"
          BODY="${{ steps.release_notes.outputs.body }}"

          # If release for this tag already exists, skip creation
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating..."
            gh release edit "$TAG" --title "$TITLE" --notes "$BODY" --draft
          else
            echo "Creating draft release for $TAG..."
            gh release create "$TAG" --title "$TITLE" --notes "$BODY" --draft --target main
          fi

  build-macos:
    name: 🍏 Build macOS (Apple Silicon ARM64)
    needs: prepare-release
    if: needs.prepare-release.outputs.skip_release != 'true'
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: ⚡ Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 📥 Install npm dependencies
        run: pnpm install --frozen-lockfile

      - name: 🛠️ Install create-dmg
        run: brew install create-dmg || true

      - name: 🏗️ Build macOS Installer (.app, .dmg with Applications shortcut, .zip)
        run: node scripts/build-dist.js --mac --out-dir=./dist-releases

      - name: 📤 Upload Actions Artifacts (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          path: dist-releases/*
          if-no-files-found: error

      - name: 🚀 Upload Assets to Draft Release
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.prepare-release.outputs.tag }}" dist-releases/* --clobber

  build-windows:
    name: 🪟 Build Windows (x64 NSIS + Standalone)
    needs: prepare-release
    if: needs.prepare-release.outputs.skip_release != 'true'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: ⚡ Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 📥 Install npm dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build Windows Installer (NSIS Setup + Standalone exe)
        run: node scripts/build-dist.js --win --out-dir=./dist-releases

      - name: 📤 Upload Actions Artifacts (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: dist-releases/*
          if-no-files-found: error

      - name: 🚀 Upload Assets to Draft Release
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.prepare-release.outputs.tag }}" dist-releases/* --clobber

  publish-release:
    name: 🚀 Publish Official GitHub Release
    needs: [prepare-release, build-macos, build-windows]
    if: needs.prepare-release.outputs.skip_release != 'true' && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📢 Publish Draft Release to Public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.prepare-release.outputs.tag }}"
          echo "Publishing release $TAG from draft..."
          gh release edit "$TAG" --draft=false

          RELEASE_URL=$(gh release view "$TAG" --json url -q .url)
          echo "### 🚀 Successfully Published Release $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Direct URL: [$RELEASE_URL]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "All macOS (.dmg, .zip) and Windows (.exe setup, .exe standalone) installer assets are attached." >> "$GITHUB_STEP_SUMMARY"
